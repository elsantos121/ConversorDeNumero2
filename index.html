<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Numérico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="converter-card">
            <h1>Conversor Numérico</h1>
            <div class="input-group">
                <input type="text" id="numberInput" placeholder="Ingrese un número..." maxlength="20">
                <div class="buttons-group">
                    <button id="toRoman" class="btn">
                        <i class="fas fa-arrow-right"></i> A Romano
                    </button>
                    <button id="toArabic" class="btn">
                        <i class="fas fa-arrow-left"></i> A Arábigo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Resultado</h2>
            <p id="resultText"></p>
        </div>
    </div>
    
    <footer>
        <div class="social-icons">
            <a href="https://github.com/elsantos121" target="_blank" class="social-icon">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/santiago-luna-671887358/" target="_blank" class="social-icon">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://www.instagram.com/orlando.luna_/" target="_blank" class="social-icon">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://wa.me/5493549580285" target="_blank" class="social-icon">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
